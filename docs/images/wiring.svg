<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690"><style>:root{--bg:#f2f5f3;--surface:#ffffff;--fg:#16201c;--muted:#5b6a64;--line:#cdd7d2;--board:#dfe8e2;--hole:#9db0a6;
--devkit:#25322d;--on-dark:#e9f0ec;--relay:#2c6cb0;--term:#3d9560;--part:#f4ead2;--screw:#d9dfdc;
--v5:#d8402b;--gnd:#1789ad;--spk:#d23c82;--led:#0d9488;--sig:#d68c00;--drv:#8f4fd0;--sw:#14803f;--ring:#ffffff;
--black:#2b2f2d;--purple:#7b3fc4;--green:#14803f;--grey:#8a958f;}@media (prefers-color-scheme: dark){:root{--bg:#0f1513;--surface:#161e1b;--fg:#e5ede9;--muted:#96a8a0;--line:#2a3832;--board:#1c2823;--hole:#40544a;
--devkit:#080c0a;--on-dark:#e9f0ec;--relay:#2a5f9c;--term:#2f7a4d;--part:#3a3526;--screw:#b9c2be;
--v5:#f0604b;--gnd:#35b3da;--spk:#f070aa;--led:#2dd4bf;--sig:#f0aa2b;--drv:#b483ee;--sw:#3fd07a;--ring:#0f1513;
--black:#c9d1cd;--purple:#b483ee;--green:#3fd07a;--grey:#6b7a73;}}svg text{font-family:ui-monospace,Consolas,'DejaVu Sans Mono',monospace}

.t { fill: var(--fg); } .tm { fill: var(--muted); } .ti { fill: var(--on-dark); } .tr { fill: #ffffff; }
.xs { font-size: 10px; } .sm { font-size: 11px; } .pinl { font-size: 11px; } .big { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
.b { font-weight: 600; }
.board { fill: var(--board); stroke: var(--hole); stroke-width: 1.2; }
.hole { fill: var(--hole); }
.devkit { fill: var(--devkit); fill-opacity: 0.93; stroke: var(--hole); stroke-width: 1; }
.ant { fill: none; stroke: var(--on-dark); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.7; }
.usb { fill: var(--screw); }
.relay { fill: var(--relay); fill-opacity: 0.9; }
.term { fill: var(--term); } .termdiv { stroke: var(--bg); stroke-width: 1.5; opacity: 0.6; }
.screw { fill: var(--screw); }
.res, .npn { fill: var(--part); stroke: var(--muted); stroke-width: 1; }
.lead { stroke: var(--muted); stroke-width: 1.5; }
.pin { fill: var(--hole); stroke: var(--on-dark); stroke-width: 1; }
.pad { stroke: var(--ring); stroke-width: 1.6; }
.pad.off { stroke: #ffffff; stroke-dasharray: 2.5 2; }
.v5 { fill: var(--v5); } .gnd { fill: var(--gnd); } .sigp { fill: var(--sig); } .drvp { fill: var(--drv); } .swp { fill: var(--sw); } .spkp { fill: var(--spk); } .ledp { fill: var(--led); }
.pad.spare { fill: var(--screw); stroke: var(--muted); }
.hdr { fill: var(--devkit); }
.w { stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.w.sig { stroke: var(--sig); } .w.led { stroke: var(--led); }
.w.v5w { stroke: var(--v5); stroke-width: 5; } .w.gndw { stroke: var(--gnd); stroke-width: 5; } .w.drv { stroke: var(--drv); } .w.sw { stroke: var(--sw); }
.diode { stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: 0.85; }
.diodefill { fill: #ffffff; } .diodebar { stroke: #ffffff; stroke-width: 2; }
.sch { stroke: var(--fg); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.sch.thick { stroke-width: 3.5; } .sch.dash { stroke: var(--muted); stroke-dasharray: 5 4; }
.sch.v5s { stroke: var(--v5); } .sch.gnds { stroke: var(--gnd); } .sch.sigs { stroke: var(--sig); } .sch.drvs { stroke: var(--drv); } .sch.sws { stroke: var(--sw); }
.schbox { fill: var(--part); stroke: var(--fg); stroke-width: 1.4; }
.schring { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.fgfill { fill: var(--fg); }
.bg{fill:var(--surface)} .title{font-size:20px;font-weight:600;fill:var(--fg)}</style><rect x="0" y="0" width="1000" height="690" class="bg"/><text x="40" y="36" class="title">BC-250 remote power: system wiring</text><defs><marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="currentColor"/></marker></defs><style>.box{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}.pcb{fill:var(--board);stroke:var(--fg);stroke-width:1.6}.wire{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.c-purple{stroke:var(--purple)} .c-black{stroke:var(--black)} .c-green{stroke:var(--green)}.c-v5{stroke:var(--v5)} .c-gnd{stroke:var(--gnd)} .c-sig{stroke:var(--sig)} .c-led{stroke:var(--led)}.c-spk{stroke:var(--spk)} .c-grey{stroke:var(--grey);stroke-width:6} .c-sw{stroke:var(--sw)}.inl{fill:var(--part);stroke:var(--fg);stroke-width:1.2}.h{font-size:15px;font-weight:600;fill:var(--fg)} .p{font-size:12px;fill:var(--fg)} .q{font-size:11px;fill:var(--muted)}.term{fill:var(--term)} .pad{stroke:var(--ring);stroke-width:1.4}</style><rect x="40" y="130" width="200" height="290" rx="6" class="box"/><text x="56" y="156" class="h">ATX PSU</text><text x="56" y="174" class="q">24-pin connector</text><rect x="370" y="110" width="260" height="350" rx="6" class="pcb"/><text x="500" y="138" class="h" text-anchor="middle">Relay protoboard</text><text x="500" y="156" class="q" text-anchor="middle">ESP32 DevKit + 2 × SRD-05VDC</text><rect x="760" y="130" width="200" height="290" rx="6" class="box"/><text x="776" y="156" class="h">BC-250</text><text x="776" y="174" class="q">board headers</text><polyline points="140,130 140,80 860,80 860,130" class="wire c-grey"/><text x="500" y="70" class="q" text-anchor="middle">12 V power to the BC-250, wired as before</text><text x="224" y="204" class="p" text-anchor="end">5VSB (purple)</text><line x1="240" y1="200" x2="370" y2="200" class="wire c-purple"/><text x="384" y="204" class="p">+5 V in</text><text x="224" y="244" class="p" text-anchor="end">GND (black)</text><line x1="240" y1="240" x2="370" y2="240" class="wire c-black"/><text x="384" y="244" class="p">GND</text><text x="224" y="314" class="p" text-anchor="end">PS_ON (green)</text><line x1="240" y1="310" x2="370" y2="310" class="wire c-green"/><text x="384" y="314" class="p">Relay 1 COM</text><text x="224" y="354" class="p" text-anchor="end">GND (black)</text><line x1="240" y1="350" x2="370" y2="350" class="wire c-black"/><text x="384" y="354" class="p">Relay 1 NO</text><text x="305" y="300" class="q" text-anchor="middle">relay 1 closes</text><text x="305" y="374" class="q" text-anchor="middle">= PSU on</text><text x="616" y="224" class="p" text-anchor="end">Relay 2 COM</text><line x1="630" y1="220" x2="760" y2="220" class="wire c-sw"/><text x="776" y="224" class="p">Power pin P</text><text x="616" y="264" class="p" text-anchor="end">Relay 2 NO</text><line x1="630" y1="260" x2="760" y2="260" class="wire c-black"/><text x="776" y="264" class="p">TPMS1 pin 17 (GND)</text><text x="616" y="344" class="p" text-anchor="end">D4 PC sense</text><line x1="630" y1="340" x2="760" y2="340" class="wire c-sig"/><text x="776" y="344" class="p">TPMS1 pin 9 (3 V)</text><rect x="675" y="331" width="40" height="18" rx="3" class="inl"/><text x="695" y="344" class="q" text-anchor="middle">1 kΩ</text><text x="695" y="208" class="q" text-anchor="middle">relay 2 = power</text><text x="695" y="288" class="q" text-anchor="middle">button press</text><text x="430" y="448" class="p" text-anchor="middle">LED</text><polyline points="418,460 418,500 238,500 238,540" class="wire c-led"/><polyline points="430,460 430,506 250,506 250,540" class="wire c-v5"/><polyline points="442,460 442,512 262,512 262,540" class="wire c-gnd"/><rect x="155" y="540" width="190" height="78" rx="6" class="box"/><text x="250" y="564" class="h" text-anchor="middle">LED strip</text><text x="250" y="584" class="q" text-anchor="middle">24 × WS2812B</text><text x="250" y="602" class="q" text-anchor="middle">DIN · +5 V · GND</text><text x="500" y="448" class="p" text-anchor="middle">SPK</text><polyline points="488,460 488,500 488,500 488,540" class="wire c-spk"/><polyline points="500,460 500,500 500,500 500,540" class="wire c-v5"/><polyline points="512,460 512,500 512,500 512,540" class="wire c-gnd"/><rect x="405" y="540" width="190" height="78" rx="6" class="box"/><text x="500" y="564" class="h" text-anchor="middle">SC8002B amp</text><text x="500" y="584" class="q" text-anchor="middle">speaker module</text><text x="500" y="602" class="q" text-anchor="middle">S · + · −</text><text x="570" y="448" class="p" text-anchor="middle">BTN</text><polyline points="558,460 558,512 738,512 738,540" class="wire c-sig"/><polyline points="570,460 570,506 750,506 750,540" class="wire c-sig"/><polyline points="582,460 582,500 762,500 762,540" class="wire c-gnd"/><rect x="655" y="540" width="190" height="78" rx="6" class="box"/><text x="750" y="564" class="h" text-anchor="middle">Power button</text><text x="750" y="584" class="q" text-anchor="middle">momentary, lit</text><text x="750" y="602" class="q" text-anchor="middle">LED via 220 Ω</text><text x="40" y="652" class="q">Strip + and − are wired straight to the +5 V / GND input terminal, not taken from the DevKit. All grounds are common through the PSU.</text><text x="40" y="670" class="q">Relay contacts are polarity-free. NC terminals stay unused.</text></svg>