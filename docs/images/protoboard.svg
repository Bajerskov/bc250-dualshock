.pad { stroke: var(--ring); stroke-width: 1.6; }
.pad.off { stroke: #ffffff; stroke-dasharray: 2.5 2; }
.v5 { fill: var(--v5); } .gnd { fill: var(--gnd); } .sigp { fill: var(--sig); } .drvp { fill: var(--drv); } .swp { fill: var(--sw); } .spkp { fill: var(--spk); } .ledp { fill: var(--led); }
.pad.spare { fill: var(--screw); stroke: var(--muted); }
.hdr { fill: var(--devkit); }
.w { stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.w.sig { stroke: var(--sig); } .w.led { stroke: var(--led); }
.w.v5w { stroke: var(--v5); stroke-width: 5; } .w.gndw { stroke: var(--gnd); stroke-width: 5; } .w.drv { stroke: var(--drv); } .w.sw { stroke: var(--sw); }
